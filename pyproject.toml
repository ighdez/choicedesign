[project]
name = "choicedesign"
version = "0.2.1"
description = "Experimental designs for discrete choice models."
authors = [
    {name = "ighdez",email = "joseignaciohernandezh@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "biogeme (>=3.2,<=3.2.13)",
    "pydoe2 (>=1.3.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.1.0,<8.0.0)"
]
